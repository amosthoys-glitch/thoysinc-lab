# 운영 배포 — Azure Static Web Apps (blog.thoysinc.com)
#
# 이쪽은 base 가 '/' 라 astro build 결과인 dist 를 그대로 올립니다.
# (보험 노트 저장소는 /note 하위 재배치가 있어 deploy 를 올립니다.)
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 매일 새벽에 한 번 다시 빌드합니다. 날짜가 미래인 글이 그날 자동으로
  # 공개되게 하려는 것입니다(예약 발행).
  schedule:
    - cron: '23 7 * * *' # 07:23 UTC = 애리조나 00:23 (MST, 서머타임 없음). GitHub 예약은 몇 시간씩 밀려서 자정 직후로 잡음

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          output_location: ""

      # 새 글이 배포되면 Bing·Naver 등에 바로 알립니다(IndexNow). 실패해도 배포는 그대로 성공 처리합니다.
      - name: IndexNow 제출
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          sleep 60
          node scripts/indexnow.mjs blog.thoysinc.com
